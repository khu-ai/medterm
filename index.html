<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>의학용어 검색기 🩺</title>
<meta name="description" content="한글·영어로 찾는 의학용어 검색기 + 어근 분해기">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>">
<style>
  :root {
    --bg: #f4f7fb; --card: #fff; --text: #17233a; --sub: #66758c;
    --accent: #1f6feb; --accent-soft: #e6efff; --border: #e2e8f0;
    --mark: #fff1a8; --shadow: 0 6px 20px rgba(23, 35, 58, .07);
  }
  body.dark {
    --bg: #0f1522; --card: #182133; --text: #e6ecf5; --sub: #93a1b8;
    --accent: #5b9bff; --accent-soft: #1f2d48; --border: #26324a;
    --mark: #6b5a00; --shadow: 0 6px 20px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--text); transition: background .3s, color .3s;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--sub); font-size: 14px; margin-top: 4px; }
  .theme-btn { border: 1px solid var(--border); background: var(--card); color: var(--text);
    width: 42px; height: 42px; border-radius: 50%; font-size: 18px; cursor: pointer; flex-shrink: 0; }

  .tabs { display: flex; gap: 6px; margin: 22px 0 14px; background: var(--card); padding: 5px;
    border-radius: 14px; border: 1px solid var(--border); }
  .tab { flex: 1; border: none; background: transparent; color: var(--sub); padding: 10px 6px;
    border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .tab.on { background: var(--accent); color: #fff; }

  .search { position: relative; }
  .search input { width: 100%; padding: 16px 18px 16px 48px; font-size: 17px; border-radius: 16px;
    border: 2px solid var(--border); background: var(--card); color: var(--text); outline: none; box-shadow: var(--shadow); }
  .search input:focus { border-color: var(--accent); }
  .search::before { content: "🔍"; position: absolute; left: 17px; top: 50%; transform: translateY(-50%); font-size: 18px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
  .chip { border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .count { color: var(--sub); font-size: 13px; margin: 6px 2px 10px; }
  .list { display: grid; gap: 10px; }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .item-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .en { font-size: 18px; font-weight: 800; }
  .ko { font-size: 16px; font-weight: 700; color: var(--accent); }
  .cat { font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 3px 9px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
  .def { color: var(--sub); font-size: 14px; margin-top: 6px; line-height: 1.55; }
  .parts-line { margin-top: 8px; font-size: 13px; }
  .parts-line b { color: var(--text); }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; font-size: 15px; }
  .more { display: block; margin: 14px auto 0; border: 1px solid var(--border); background: var(--card); color: var(--text);
    padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; }

  .decomp-result { margin-top: 16px; }
  .pieces { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
  .piece { background: var(--card); border: 2px solid var(--accent); border-radius: 12px; padding: 10px 14px; text-align: center; min-width: 90px; }
  .piece .p-form { font-size: 17px; font-weight: 800; }
  .piece .p-type { font-size: 11px; color: var(--sub); margin-top: 2px; }
  .piece .p-mean { font-size: 14px; color: var(--accent); font-weight: 700; margin-top: 4px; }
  .piece.unknown { border-style: dashed; border-color: var(--sub); }
  .piece.vowel { border-color: var(--border); min-width: 44px; }
  .hint { color: var(--sub); font-size: 13px; line-height: 1.6; margin-top: 10px; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  footer { text-align: center; color: var(--sub); font-size: 12px; margin-top: 36px; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>의학용어 <span>검색기</span> 🩺</h1>
      <p class="sub">한글이나 영어, 약어로 검색하고 어근으로 뜻을 풀어 보세요</p>
    </div>
    <button class="theme-btn" id="themeBtn" title="다크 모드 전환">🌙</button>
  </header>

  <div class="tabs">
    <button class="tab on" data-tab="terms">📖 용어 검색</button>
    <button class="tab" data-tab="parts">🧩 어근·접두사·접미사</button>
    <button class="tab" data-tab="decomp">🔬 단어 분해기</button>
  </div>

  <!-- 용어 검색 -->
  <section id="tab-terms">
    <div class="search"><input id="q" type="search" placeholder="예: 심근경색, hepatitis, BP" autocomplete="off"></div>
    <div class="chips" id="catChips"></div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>
    <button class="more" id="moreBtn" style="display:none">더 보기</button>
  </section>

  <!-- 어근 -->
  <section id="tab-parts" style="display:none">
    <div class="search"><input id="pq" type="search" placeholder="예: itis, 심장, hepat" autocomplete="off"></div>
    <div class="chips" id="partChips"></div>
    <div class="count" id="pcount"></div>
    <div class="list" id="plist"></div>
  </section>

  <!-- 분해기 -->
  <section id="tab-decomp" style="display:none">
    <div class="search"><input id="dq" type="search" placeholder="영어 의학용어 입력 (예: gastroenteritis)" autocomplete="off"></div>
    <div class="examples" id="examples"></div>
    <div class="decomp-result" id="dresult"></div>
    <p class="hint">💡 의학용어는 대부분 <b>접두사 + 어근 + (연결모음 o) + 접미사</b>로 이루어져요.
      예를 들어 <b>hepat</b>(간) + <b>itis</b>(염증) = hepatitis(간염)이에요.
      분해 결과는 자동으로 추정한 것이라 틀릴 수 있어요.</p>
  </section>

  <footer>
    학습용 의학용어 사전 · 용어 <span id="totalTerms"></span>개 · 어근 <span id="totalParts"></span>개<br>
    ⚠️ 공부용 참고 자료예요. 진단이나 치료에 사용하지 마세요.
  </footer>
</div>

<script>
// ================= 데이터 =================
// 형식: 영어|한글|분류코드|설명
const CATS = {
  a: "해부·방향", g: "일반·병리", c: "심혈관", r: "호흡기", d: "소화기", n: "신경",
  m: "근골격", u: "비뇨·생식", e: "내분비", b: "혈액·면역", s: "피부",
  o: "눈·귀·코", i: "감염", p: "정신", t: "검사·치료·약물", x: "약어"
};

const TERM_DATA = `
anterior|전방(앞쪽)|a|몸의 앞쪽, 배 쪽을 가리킴
posterior|후방(뒤쪽)|a|몸의 뒤쪽, 등 쪽을 가리킴

lateral|외측|a|몸의 정중선에서 더 먼 위치
proximal|근위|a|몸통이나 부착 부위에 더 가까운 위치

dorsal|등쪽|a|등 쪽(후방)과 같은 뜻
ventral|배쪽|a|배 쪽(전방)과 같은 뜻
supine|앙와위|a|등을 대고 바로 누운 자세
prone|복와위|a|배를 대고 엎드린 자세

coronal plane|관상면|a|몸을 앞뒤로 나누는 면 (frontal plane)
transverse plane|횡단면|a|몸을 위아래로 나누는 면
abdomen|복부|a|가슴과 골반 사이의 배 부분
thorax|흉부|a|목과 횡격막 사이의 가슴 부분
pelvis|골반|a|몸통 아래쪽, 엉덩뼈로 둘러싸인 부분
cranium|두개골|a|뇌를 감싸는 머리뼈
vertebra|척추뼈|a|척주를 이루는 각각의 뼈 (복수형 vertebrae)

clavicle|쇄골|a|어깨와 흉골을 잇는 빗장뼈
scapula|견갑골|a|등 위쪽의 삼각형 어깨뼈
humerus|상완골|a|위팔의 뼈
radius|요골|a|아래팔 엄지 쪽의 뼈
ulna|척골|a|아래팔 새끼손가락 쪽의 뼈
femur|대퇴골|a|넓적다리뼈, 인체에서 가장 긴 뼈
tibia|경골|a|정강이 안쪽의 굵은 뼈
fibula|비골|a|정강이 바깥쪽의 가는 뼈
diaphragm|횡격막|a|흉강과 복강을 나누는 호흡 근육

mediastinum|종격동|a|양쪽 폐 사이의 공간 (심장, 기관, 식도 등이 있음)
diagnosis|진단|g|증상과 검사를 바탕으로 병을 판정하는 것

congenital|선천성|g|태어날 때부터 있는

atrophy|위축|g|세포나 조직, 장기의 크기가 줄어드는 것
hypertrophy|비대|g|세포 크기가 커져 조직이 커지는 것
hyperplasia|과형성|g|세포 수가 늘어나 조직이 커지는 것
neoplasm|신생물(종양)|g|비정상적으로 증식한 조직 덩어리
metastasis|전이|g|암세포가 다른 장기로 퍼지는 것
biopsy|생검|g|진단을 위해 조직 일부를 떼어 내 검사하는 것
pyrexia|발열|g|체온이 정상보다 높은 상태 (fever)
syncope|실신|g|뇌 혈류가 줄어 일시적으로 의식을 잃는 것
malaise|권태감|g|전신이 불편하고 기운이 없는 느낌
anorexia|식욕부진|g|식욕이 떨어지거나 없는 상태
cachexia|악액질|g|만성 질환으로 인한 심한 체중 감소와 쇠약
remission|관해|g|병의 증상이 줄거나 사라진 상태
relapse|재발|g|좋아졌던 병이 다시 나빠지는 것
palliative care|완화의료|g|완치보다 증상 완화와 삶의 질에 초점을 둔 치료
asymptomatic|무증상|g|증상이 없는 상태
comorbidity|동반질환|g|주된 질환과 함께 가지고 있는 다른 질환
incidence|발생률|g|일정 기간 새로 생긴 환자의 비율
prevalence|유병률|g|특정 시점에 병을 가진 사람의 비율

tachycardia|빈맥|c|심박수가 분당 100회를 넘는 상태
bradycardia|서맥|c|심박수가 분당 60회 미만인 상태
arrhythmia|부정맥|c|심장 박동의 리듬이나 속도가 비정상인 상태
atrial fibrillation|심방세동|c|심방이 불규칙하게 빠르게 떨리는 부정맥 (AF)
myocardial infarction|심근경색|c|관상동맥이 막혀 심장 근육이 괴사하는 질환 (MI)
angina pectoris|협심증|c|심근 허혈로 생기는 가슴 통증
heart failure|심부전|c|심장이 몸에 필요한 만큼 혈액을 내보내지 못하는 상태
cardiomyopathy|심근병증|c|심장 근육 자체에 생긴 질환
atherosclerosis|죽상경화증|c|동맥 벽에 지방(플라크)이 쌓여 좁아지는 것

pericarditis|심낭염|c|심장을 싸는 막(심낭)의 염증
myocarditis|심근염|c|심장 근육의 염증
murmur|심잡음|c|청진할 때 들리는 비정상적인 심장 소리

// ================= 데이터 정리 =================
const TERMS = TERM_DATA.trim().split("\n").map(line => {
  const [en, ko, c, def] = line.split("|");
  return { en, ko, cat: CATS[c] || "기타", def };
});
const PARTS = PART_DATA.trim().split("\n").map(line => {
  const [form, type, mean, ex] = line.split("|");
  return { form, type, mean, ex };
});

// 분해기용: "hem/o, hemat/o" → ["hem","hemat"] 같은 순수 형태
const PART_FORMS = [];
PARTS.forEach(p => {
  p.form.split(",").forEach(f => {
    const clean = f.trim().replace(/\/[a-z]+$/, "").replace(/-/g, "");
    if (clean.length >= 2) PART_FORMS.push({ text: clean, part: p });
  });
});
PART_FORMS.sort((a, b) => b.text.length - a.text.length);

// ================= 도우미 =================
const $ = id => document.getElementById(id);
function norm(s) { return s.toLowerCase().replace(/[\s\-'’·]/g, ""); }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function hl(text, q) {
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
}
function load(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

// ================= 용어 검색 =================
let curCat = "전체", shown = 40;

function renderCatChips() {
  const box = $("catChips");
  box.innerHTML = "";
  ["전체", ...Object.values(CATS)].forEach(c => {
    const b = document.createElement("button");
    b.className = "chip" + (c === curCat ? " on" : "");
    b.textContent = c;
    b.onclick = () => { curCat = c; shown = 40; renderCatChips(); renderTerms(); };
    box.appendChild(b);
  });
}

function scoreTerm(t, q, nq) {
  // 정확히 일치 > 시작 > 포함 > 설명에 포함
  const en = norm(t.en), ko = norm(t.ko);
  if (en === nq || ko === nq) return 100;
  if (en.startsWith(nq) || ko.startsWith(nq)) return 80;
  if (en.includes(nq) || ko.includes(nq)) return 60;
  if (norm(t.def).includes(nq)) return 30;
  return 0;
}

function renderTerms() {
  const raw = $("q").value.trim();
  const nq = norm(raw);
  let list = TERMS.filter(t => curCat === "전체" || t.cat === curCat);
  if (nq) {
    list = list.map(t => ({ t, s: scoreTerm(t, raw, nq) }))
      .filter(x => x.s > 0).sort((a, b) => b.s - a.s).map(x => x.t);
  } else {
    list = list.slice().sort((a, b) => a.en.localeCompare(b.en));
  }
  $("count").textContent = (nq ? `"${raw}" 검색 결과 ` : "") + list.length + "개";

  const box = $("list");
  if (list.length === 0) {
    box.innerHTML = `<div class="empty">찾는 용어가 없어요 😢<br><br>
      영어 용어라면 <b>🔬 단어 분해기</b>에 넣어서 뜻을 추측해 보세요.</div>`;
    $("moreBtn").style.display = "none";
    return;
  }
  box.innerHTML = list.slice(0, shown).map(t => `
    <div class="item">
      <div class="item-top">
        <div><span class="en">${hl(t.en, raw)}</span>&nbsp;&nbsp;<span class="ko">${hl(t.ko, raw)}</span></div>
        <span class="cat">${t.cat}</span>
      </div>
      <div class="def">${hl(t.def, raw)}</div>
      ${t.cat !== "약어" ? partsLine(t.en) : ""}
    </div>`).join("");
  $("moreBtn").style.display = list.length > shown ? "block" : "none";
}

function partsLine(en) {
  const res = decompose(en).filter(p => p.part);
  if (res.length < 2) return "";
  return `<div class="parts-line">🧩 ${res.map(p => `<b>${esc(p.text)}</b>(${esc(p.part.mean.split(",")[0])})`).join(" + ")}</div>`;
}

$("q").addEventListener("input", () => { shown = 40; renderTerms(); });
$("moreBtn").onclick = () => { shown += 40; renderTerms(); };

// ================= 단어 분해기 =================
function decompose(word) {
  const w = word.toLowerCase().replace(/[^a-z]/g, "");
  const out = [];
  let i = 0, unknown = "";
  while (i < w.length) {
    // 후보 중에서 뒤에 이어지는 부분도 잘 풀리는 것을 우선 선택
    const cands = PART_FORMS.filter(f => w.startsWith(f.text, i));
    const startsKnown = pos => pos >= w.length || PART_FORMS.some(f => w.startsWith(f.text, pos)) ||
      ((w[pos] === "o" || w[pos] === "i") && PART_FORMS.some(f => w.startsWith(f.text, pos + 1)));
    let found = cands.find(f => startsKnown(i + f.text.length)) || null;
    // 예: cardi + itis → card + itis (끝 모음이 겹치는 경우)
    if (!found) {
      const f = cands.find(f => /[aeio]$/.test(f.text) && startsKnown(i + f.text.length - 1));
      if (f) found = { text: f.text.slice(0, -1), part: f.part };
    }
    if (!found) found = cands[0] || null;
    if (found) {
      if (unknown) { out.push({ text: unknown }); unknown = ""; }
      out.push({ text: found.text, part: found.part });
      i += found.text.length;
    } else if ((w[i] === "o" || w[i] === "i") && out.length && out[out.length - 1].part && !unknown) {
      out.push({ text: w[i], vowel: true });
      i++;
    } else {
      unknown += w[i]; i++;
    }
  }
  if (unknown) out.push({ text: unknown });
  return out;
}

function renderDecomp() {
  const raw = $("dq").value.trim();
  const box = $("dresult");
  if (!raw) { box.innerHTML = ""; return; }
  const pieces = decompose(raw);
  const known = pieces.filter(p => p.part);
  const match = TERMS.find(t => norm(t.en) === norm(raw));
  box.innerHTML = `
    <div class="pieces">${pieces.map(p => p.part ? `
      <div class="piece"><div class="p-form">${esc(p.text)}</div><div class="p-type">${p.part.type}</div><div class="p-mean">${esc(p.part.mean)}</div></div>`
      : p.vowel ? `<div class="piece vowel"><div class="p-form">${p.text}</div><div class="p-type">연결모음</div></div>`
      : `<div class="piece unknown"><div class="p-form">${esc(p.text)}</div><div class="p-type">모르는 부분</div></div>`).join("")}
    </div>
    ${known.length ? `<div class="item"><div class="def">👉 뜻 추측: <b>${known.map(p => esc(p.part.mean.split(",")[0])).join(" + ")}</b></div>
      ${match ? `<div class="def">📖 사전 뜻: <b>${esc(match.ko)}</b> – ${esc(match.def)}</div>` : ""}</div>`
      : `<div class="empty">알고 있는 어근을 찾지 못했어요</div>`}`;
}
$("dq").addEventListener("input", renderDecomp);

  btn.onclick = () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b === btn));
    ["terms", "parts", "decomp"].forEach(id => {
      $("tab-" + id).style.display = btn.dataset.tab === id ? "block" : "none";
    });
  };
});

// ================= 다크 모드 =================
function applyTheme(d) { document.body.classList.toggle("dark", d); $("themeBtn").textContent = d ? "☀️" : "🌙"; }
applyTheme(load("dark", false));
$("themeBtn").onclick = () => { const d = !document.body.classList.contains("dark"); applyTheme(d); save("dark", d); };

// ================= 시작 =================
$("totalTerms").textContent = TERMS.length;
$("totalParts").textContent = PARTS.length;
renderCatChips(); renderTerms();
renderPartChips(); renderParts();
</script>
</body>
</html>
